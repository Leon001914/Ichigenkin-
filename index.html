<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ichigenkin 一絃琴</title>
<script>document.documentElement.className+=' js';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Noto+Serif+JP:wght@300;400;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FFFDF6; --cream:#F6F0E0; --gold:#D2AE36; --gold-d:#A77E00; --char:#333333;
  --fg:#333333; --fg2:#5F5C53; --rl:rgba(51,51,51,.22); --hair:rgba(167,126,0,.45); --bg:#FFFDF6;
  --bar:3.6rem;
  --cursive:'Liu Jian Mao Cao','Noto Serif SC','Noto Serif JP',cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.6rem)}
body{margin:0;background:var(--ivory);color:var(--fg);
  font-family:'Noto Serif JP','Noto Serif SC',serif;font-size:1.0625rem;line-height:1.9;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang^="zh"] body{font-family:'Noto Serif SC','Noto Serif JP',serif}
h1,h2,h3{font-family:'Playfair Display','Noto Serif JP','Noto Serif SC',serif;margin:0;font-weight:500;line-height:1.22;text-wrap:balance}
html[lang^="zh"] h1,html[lang^="zh"] h2,html[lang^="zh"] h3{font-family:'Playfair Display','Noto Serif SC','Noto Serif JP',serif}
p{margin:0 0 1rem;text-wrap:pretty}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-d);outline-offset:3px}
small{font-size:.72em;color:var(--fg2);margin-left:.35em;font-weight:400}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.25rem;position:relative;z-index:1}

/* barra superior minimalista */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:color-mix(in srgb,var(--ivory) 92%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:.1rem 2rem;min-height:var(--bar)}
.brand{font-size:1.35rem;font-weight:700;letter-spacing:.16em;text-decoration:none;color:var(--gold-d);line-height:1}
.idx{display:flex;gap:1.8rem;flex:1;justify-content:center;font-size:.93rem}
.idx a{text-decoration:none;padding:.35rem 0;border-bottom:2px solid transparent;white-space:nowrap}
.idx a:hover{border-bottom-color:var(--hair)}
.idx a[aria-current="true"]{border-bottom-color:var(--gold-d)}
.langs{display:flex;gap:.15rem}
.langs button{background:none;border:0;border-bottom:2px solid transparent;padding:.15rem .5rem;font-size:.85rem;color:var(--fg2)}
.langs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--gold-d);font-weight:700}
@media (max-width:900px){
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 6.4rem)}
  .bar-in{padding-top:.5rem;padding-bottom:.2rem}
  .langs{margin-left:auto}
  .idx{order:3;flex:1 0 100%;justify-content:flex-start;overflow-x:auto;gap:1.3rem;scrollbar-width:none}
  .idx::-webkit-scrollbar{display:none}
}

/* seções */
.sec{position:relative;overflow:hidden;overflow:clip;background:var(--bg);padding:clamp(4.5rem,10vw,8rem) 0}
.cream{--bg:#F6F0E0}
h2{font-size:clamp(1.9rem,3.6vw,2.7rem);margin-bottom:1.3rem}
h3{font-size:1.2rem;margin-bottom:.8rem}
.measure{max-width:60ch}

/* escrita vertical cursiva */
.vc{font-family:var(--cursive);writing-mode:vertical-rl;line-height:1.05;user-select:none;pointer-events:none;color:var(--gold)}
.vc-main{font-size:clamp(5.5rem,12.5vw,11.5rem);letter-spacing:.02em}
.vc-main.two{font-size:clamp(5.5rem,13vw,12rem)}
.vc-edge{position:absolute;z-index:0;font-size:clamp(14rem,34vw,30rem);color:rgba(210,174,54,.17)}
.e-hero{right:-2vw;top:-1rem}
.e-parts{left:-3vw;top:1rem}
.e-tune{right:-3vw;bottom:-4rem}
.e-about{right:2vw;top:-1rem}
.vc-s{font-size:clamp(2rem,3.4vw,2.8rem);color:var(--gold-d);line-height:1.1}

/* composição: texto | caligrafia | pintura */
.spread{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.85fr);grid-template-areas:"t c f";
  gap:clamp(1.5rem,4vw,4rem);align-items:center}
.spread.rev{grid-template-columns:minmax(0,.85fr) auto minmax(0,1fr);grid-template-areas:"f c t"}
.spread.rev.wide{grid-template-columns:minmax(0,1.15fr) auto minmax(0,.85fr)}
.spread.top{align-items:start}
.spread.one{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"c t"}
.t{grid-area:t}.c{grid-area:c}.f{grid-area:f}
@media (max-width:900px){
  .spread,.spread.rev,.spread.rev.wide{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"c t" "c f";gap:1.6rem 1.1rem;align-items:start}
  .spread.one{grid-template-areas:"c t"}
  .vc-main,.vc-main.two{font-size:clamp(4.2rem,17vw,6.2rem)}
}

/* pinturas: moldura fina, muito respiro */
.art{position:relative;margin:0;display:flex;justify-content:center;align-items:stretch;gap:.9rem}
.mat{flex:0 1 400px;min-width:0;background:var(--cream);padding:clamp(10px,1.6vw,18px);border:1px solid var(--hair)}
.cream .mat{background:var(--ivory)}
.art.wide .mat{flex:1 1 auto;max-width:620px}
.mat img{display:block;width:100%;height:auto}
.art .side{display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:1rem}
.sig{writing-mode:vertical-rl;font-size:.86rem;letter-spacing:.35em;color:var(--fg2);line-height:1.4}
.stick{position:sticky;top:calc(var(--bar) + 1.8rem);align-self:start}
@media (max-width:900px){.stick{position:static}}

/* abertura */
.hero{position:relative;overflow:hidden;overflow:clip;background:var(--ivory);
  padding:clamp(3rem,7vw,6rem) 0;min-height:min(calc(100svh - var(--bar)),52rem);display:flex;align-items:center}
.hero .wrap{width:100%}
.hero h1{font-size:clamp(3.2rem,7.4vw,6.2rem);font-weight:500;letter-spacing:-.01em;line-height:1.02;margin-bottom:1.1rem}
.tag{font-size:1.3rem;margin-bottom:1rem;line-height:1.6}
.lead{max-width:42ch}
.cta{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;margin-top:1.8rem;align-items:center}
.btn{display:inline-block;text-decoration:none;font-size:1rem;line-height:1.5}
.btn.pri{background:var(--gold);border:1px solid var(--gold-d);color:var(--char);font-weight:600;padding:.72rem 1.5rem;border-radius:2px}
.btn.pri:hover{background:#DDBB4E}
.btn.out{border-bottom:1px solid var(--gold-d);padding:.25rem .1rem}
.btn.out:hover{border-bottom-width:2px}
@media (prefers-reduced-motion:no-preference){
  html.js .rv{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
  html.js .rv.in{opacity:1;transform:none}
  html.js .vc-main.rv{transform:translateY(-10px)}
  html.js .vc-main.rv.in{transform:none}
}

/* Kin */
.kin{margin-top:clamp(3rem,7vw,5rem);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:clamp(1.6rem,4vw,2.6rem) 0}
.kin-head p{margin:.2rem 0 0;color:var(--fg2)}
.scroll{overflow-x:auto;margin:1rem 0 .4rem;padding-bottom:.2rem}
.scroll svg{display:block;width:100%;min-width:880px;height:auto;color:var(--fg);font-family:inherit}
.scroll text{fill:currentColor;font-family:inherit}
.mk-svg{cursor:pointer}
.mk-svg .dot{fill:#FFFDF6;stroke:#5E5034;stroke-width:1.2;transition:fill .15s}
.mk-svg:hover .dot{fill:#F0DA8A}
.mk-svg.sel .dot{fill:var(--gold);stroke:#3A2C00}
.readout{display:grid;grid-template-columns:auto 1fr;gap:1.4rem;align-items:center;margin:1.1rem 0 1.2rem}
.rd-glyph{display:grid;justify-items:center;gap:.35rem;font-size:.85rem;color:var(--fg2)}
.tile-lg{width:5.6rem;height:6.6rem;display:grid;place-items:center;border:1px solid var(--gold-d);background:var(--ivory);color:var(--char)}
.rd{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.8rem 1.4rem;margin:0}
.rd dt{font-size:.85rem;color:var(--fg2);line-height:1.4}
.rd dd{margin:0;font-size:1.5rem;font-weight:600;line-height:1.4}
.marks{display:grid;grid-template-columns:repeat(auto-fit,minmax(3.7rem,1fr));gap:.4rem}
.marks button{background:transparent;border:1px solid var(--rl);padding:.35rem .2rem;text-align:center;line-height:1.35;border-radius:2px}
.marks button:hover{border-color:var(--fg)}
.marks button[aria-pressed="true"]{border-color:var(--gold-d);background:rgba(210,174,54,.25)}
.mk-n{display:block;font-size:1.15rem}
.mk-t{display:block;font-size:.76rem;color:var(--fg2)}
.caption{margin:1rem 0 0;font-size:.88rem;color:var(--fg2);line-height:1.7}

/* anatomia */
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(11.5rem,1fr));gap:0 2rem;margin:0 0 clamp(2.5rem,6vw,4rem)}
.spec div{border-top:1px solid var(--rl);padding:.7rem 0}
.spec dt{font-size:.85rem;color:var(--fg2);line-height:1.5}
.spec dd{margin:0;font-size:1.05rem}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:2.4rem 3.5rem}
.parts h3{border-bottom:1px solid var(--gold-d);padding-bottom:.4rem}
.part{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:.9rem;padding:.75rem 0;border-bottom:1px solid var(--rl)}
.pk{font-size:1.4rem;font-weight:600;line-height:1.3}
.pk span{display:block;font-size:.78rem;font-weight:400;color:var(--fg2);letter-spacing:.02em}
.part strong{font-weight:600}
.part p{margin:.1rem 0 0;font-size:.95rem;line-height:1.75;color:var(--fg2)}
.gnote{font-size:.9rem;color:var(--fg2);margin:.9rem 0 0;line-height:1.7}

/* afinação */
.split2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(1.5rem,5vw,4rem);align-items:start}
@media (max-width:860px){.split2{grid-template-columns:1fr}}
.scale{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0 1.4rem}
.scale div{min-width:4.2rem;padding:.5rem .6rem;border:1px solid var(--fg);text-align:center;line-height:1.35}
.scale div:first-child{background:var(--gold);border-color:var(--gold-d);color:var(--char)}
.scale b{display:block;font-size:1.2rem;font-weight:600}
.scale span{font-size:.8rem;opacity:.8}
.callout{border-left:2px solid var(--gold-d);padding:.2rem 0 .2rem 1rem;color:var(--fg2);font-size:.95rem;line-height:1.75}
table{width:100%;border-collapse:collapse}
caption{text-align:left;font-weight:600;padding:0 0 .6rem;font-size:1.05rem}
th,td{padding:.42rem .5rem;border-bottom:1px solid var(--rl);text-align:left;font-weight:400;font-size:.98rem}
thead th{font-size:.85rem;color:var(--fg2);border-bottom-color:var(--fg)}
tbody th{white-space:nowrap}
tbody th .kn{display:inline-block;min-width:2.2rem;font-size:1.05rem}
tbody tr:last-child{font-weight:600}

/* Lu Pu */
.seal{display:inline-grid;place-items:center;width:3.2rem;height:3.2rem;background:var(--gold-d);color:var(--ivory);
  font-weight:700;font-size:1.3rem;line-height:1.05;writing-mode:vertical-rl;border-radius:3px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);flex:none}
.h-row{display:flex;align-items:center;gap:1rem;margin-bottom:.7rem}
.h-row h2{margin:0}
.nameplate{display:flex;flex-wrap:wrap;align-items:baseline;gap:.1rem .9rem;font-size:1rem;color:var(--fg2);margin:0 0 1.4rem;line-height:1.6}
.nameplate span:empty{display:none}
.kj{font-size:1.25rem;font-weight:600;letter-spacing:.12em;color:var(--fg)}
.glyph{display:inline-flex;flex-direction:column;align-items:center;position:relative;line-height:1}
.g-top{font-size:1.15rem;margin-bottom:.15rem}
.g-main{font-size:2.6rem}
.g-in{position:absolute;left:50%;bottom:.45rem;transform:translateX(-50%);font-size:1.25rem}
.ex{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:1rem;align-items:center;padding:.9rem 0;border-top:1px solid var(--rl);font-size:.98rem;line-height:1.7}
.ex:last-child{border-bottom:1px solid var(--rl)}
.ex p{margin:0}
.tile-md{width:5.6rem;height:5.6rem;display:grid;place-items:center;border:1px solid var(--char);background:var(--ivory);color:var(--char)}
.cream .tile-md,.cream .tile{background:var(--ivory)}
.lp2{margin-top:clamp(3rem,7vw,5rem)}
.lp2 h3{margin-top:2.8rem}
.lp2 h3:first-child{margin-top:0}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.5rem;margin:1.2rem 0 0;padding:0;list-style:none}
.numgrid li{border:1px solid var(--rl);padding:.45rem .3rem;text-align:center;line-height:1.35;background:var(--cream)}
.numgrid .nk{display:block;font-size:1.4rem;font-weight:600}
.numgrid .nd{display:block;font-size:.82rem;color:var(--fg2)}
.techs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));gap:0 3.5rem}
.tech{list-style:none;margin:0;padding:0}
.tech li{display:grid;grid-template-columns:4.4rem minmax(0,1fr);gap:1rem;padding:1rem 0;border-top:1px solid var(--rl)}
.tech li:last-child{border-bottom:1px solid var(--rl)}
.tile{width:4.4rem;height:4.4rem;display:grid;place-items:center;border:1px solid var(--char);font-size:2.4rem;line-height:1;background:var(--ivory);color:var(--char)}
.tech strong{display:block;font-weight:600;line-height:1.5;font-size:1.12rem}
.tech .py{font-size:.85rem;font-weight:400;color:var(--fg2);margin-left:.45rem;letter-spacing:.01em}
.tech .mean{display:block;font-size:.9rem;color:var(--fg2);line-height:1.55;margin-bottom:.25rem}
.tech p{margin:0;font-size:.96rem;line-height:1.75}
.wip{margin-top:2.5rem;padding:1rem 1.2rem;border:1px dashed var(--fg2);color:var(--fg2);font-size:.95rem;max-width:62ch}

/* tradicional, sobre, rodapé */
.soon{display:inline-block;border:1px solid var(--gold-d);color:var(--fg);padding:.1rem .9rem;border-radius:2px;font-size:.95rem;margin-top:.4rem}
footer{background:var(--cream);color:var(--fg2);border-top:1px solid var(--hair);padding:2.2rem 0 calc(2.6rem + env(safe-area-inset-bottom,0px));font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:.6rem 2rem;align-items:baseline}
footer strong{color:var(--gold-d);font-size:1.15rem;letter-spacing:.14em}
footer p{margin:0;flex:1 1 22rem;line-height:1.7}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="#top" aria-label="Ichigenkin">一絃琴</a>
    <nav class="idx" aria-label="Menu">
      <a href="#instrumento"><span class="t" data-i18n="nav.instrument"></span></a>

</header>

 inst:{h:'O instrumento',p1:'O Ichigenkin (一絃琴) tem uma única corda de seda crua esticada sobre uma prancha de madeira. Toca-se ajoelhado, em seiza, com o instrumento apoiado numa mesa baixa, o kotodai.',p2:'A mão direita pinça a corda com um tubo curto (ryūsō). A esquerda desliza um tubo mais longo (tenkan) pela corda para mudar a altura do som. Não há trastes: qualquer nota entre as marcas pode ser produzida.'},

 tune:{h:'Afinação e escala',p1:'A corda solta pode ser afinada em alturas diferentes: já foram documentados Fá♯ (92 Hz), Sol (98 Hz) e Lá (110 Hz). Lá é a referência mais comum hoje, mas não é absoluta. Uma corda mais grossa (cerca de 1,0 mm) soa mais grave que a tradicional, de cerca de 0,75 mm.',p2:'A escala tradicional do instrumento é a Hirajoshi, uma pentatônica de fórmula 1 – 2 – ♭3 – 5 – ♭6. Em Lá, suas cinco notas são:',p3:'A extensão é de cerca de duas oitavas e uma quarta justa: da corda solta (Lá, 110 Hz) até o Ré agudo (cerca de 587 Hz). As doze marcas chegam ao Dó; acima dele, e entre as marcas, o Kin também soa, porque não tem trastes.',note:'As notas de cada marca são uma dedução lógica da escala Hirajoshi. Um afinador digital pode mostrar pequenos desvios em cents (por exemplo, +15) em algumas marcas. Isso é normal: a corda solta é a referência.',tt:'As doze marcas, da cabeça à cauda',th1:'Marca',th2:'Nota',th3:'Altura',open:'Solta'},
 not:{h:'Partitura contemporânea',name:"Notação reduzida do Ichigenkin",intro:"A notação reduzida do Ichigenkin foi criada para tornar o instrumento mais simples de aprender e de escrever. Ela parte do antigo sistema do livro Sumagoto no Ishiroi e das partituras jianzipu (減字譜) do guqin: cada gesto é um radical, e o radical diz o que as mãos devem fazer.",readH:'Como ler um símbolo',readP:'Um símbolo diz como a mão direita toca (o radical) e, quando a corda é pressionada, em qual marca a mão esquerda a segura (o numeral escrito acima do 冖).',ex1:"广: som solto (散音, San’on), sem numeral.",ex2:"冖 sob o numeral 三: som pressionado (按音, An’on) na 3ª marca, que soa Lá.",ex3:"水 dentro de 冖: tremolo rápido (滾奏, Konsō) com a corda pressionada; o numeral da marca vai acima.",numH:'Os doze orvalhos',numP:'A contagem começa na cabeça do dragão e segue em direção à cauda. A corda solta não é numerada.',rh:'Mão direita',lh:'Mão esquerda',wip:"A notação reduzida segue em desenvolvimento: novas regras e as primeiras partituras serão publicadas aqui."},

  rd:['Toca-se a corda livre, sem pressioná-la.','Corda pressionada numa das marcas. Vazio, indica um único dedilhar, sem gestos.','Dedilhar rápido e vigoroso. O 水 e suas variantes são livres dentro de 广 e em posição dentro de 冖.','Dedilhar suave e delicado.','','Abafa-se a corda de repente com a palma da mão.'],

var strA=document.getElementById('strA'), strB=document.getElementById('strB');
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var raf=0, sel=0, px=TAIL;

function wave(x0,x1,amp,ph){
  var n=64,d='';
  for(var i=0;i<=n;i++){var u=i/n,x=x0+(x1-x0)*u,y=CY+amp*ph*Math.sin(Math.PI*u);
    d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
  return d;
}
function drawString(amp,ph){
  strA.setAttribute('d',wave(KOMA,px,amp,ph));
  strB.setAttribute('d',px<TAIL-1?'M'+px.toFixed(1)+' '+CY+' L'+TAIL+' '+CY:'');
}
function vibrate(f){
  cancelAnimationFrame(raf);
  if(reduce){drawString(0,0);return;}
  var t0=performance.now(), fv=6+Math.min(9,f/70);
  (function step(now){
    var t=(now-t0)/1000, amp=8*Math.exp(-t/0.75);
    drawString(amp,Math.cos(2*Math.PI*fv*t));
    if(t<2.4) raf=requestAnimationFrame(step); else drawString(0,0);
  })(t0);
}

/* ---------- som ---------- */
var ac=null;
function pluck(f){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    var t=ac.currentTime, out=ac.createGain(); out.gain.value=.55;
    var lp=ac.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(Math.min(7000,f*12),t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(700,f*2.2),t+1.6);
    lp.connect(out); out.connect(ac.destination);
    [[1,1,2.8],[2,.5,1.9],[3,.3,1.3],[4,.15,.95],[5,.08,.65],[6,.04,.45]].forEach(function(p){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=f*p[0]*(1+0.0005*p[0]*p[0]);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(p[1]*.32,t+.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t+p[2]+.05);
    });
  }catch(e){}
}

/* ---------- seleção ---------- */
function markMidi(i){return i===0?OPEN:MARKS[i-1];}
function renderReadout(){
  var m=markMidi(sel), n=nameParts(m);
  document.getElementById('rdNote').innerHTML=n.sub?n.main+' <small>'+n.sub+'</small>':n.main;
  document.getElementById('rdFreq').textContent='≈ '+Math.round(freq(m))+' Hz';
  document.getElementById('rdPos').textContent=sel===0?get('kin.openLong'):get('kin.mark')(sel);
  document.getElementById('rdGlyph').innerHTML=sel===0?glyph({main:'广'}):glyph({top:NUMK[sel-1],main:'冖'});
}
function renderSel(){
  var b=document.querySelectorAll('#marks button');
  for(var i=0;i<b.length;i++) b[i].setAttribute('aria-pressed',String(+b[i].getAttribute('data-i')===sel));
  var g=svg.querySelectorAll('.mk-svg');
  for(var j=0;j<g.length;j++) g[j].classList.toggle('sel',+g[j].getAttribute('data-i')===sel);
  renderReadout();
}
function choose(i,play){
  sel=i; px=i===0?TAIL:markX(markMidi(i));
  renderSel();
  var f=freq(markMidi(i));
  drawString(0,0);
  if(play){pluck(f);vibrate(f);}
}
svg.addEventListener('click',function(e){
  var g=e.target.closest?e.target.closest('.mk-svg'):null;
  if(g) choose(+g.getAttribute('data-i'),true);
});
document.getElementById('marks').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;
  if(b) choose(+b.getAttribute('data-i'),true);
});

/* ---------- renderização por idioma ---------- */
function techs(rad,names,descs){
  var t='';
  for(var z=0;z<rad.length;z++){
    t+='<li><div class="tile">'+rad[z][0]+'</div><div><strong>'+rad[z][3]+'<span class="py">'+rad[z][4]+' '+rad[z][5]+'</span></strong>'+
       '<span class="mean">'+rad[z][1]+' ('+rad[z][2]+'): '+esc(names[z])+'</span>'+(descs[z]?'<p>'+esc(descs[z])+'</p>':'')+'</div></li>';
  }
  return t;
}
function render(){
  document.documentElement.lang=HTMLLANG[lang];
  document.title=T[lang].title;
  var els=document.querySelectorAll('[data-i18n]');
  for(var i=0;i<els.length;i++) els[i].textContent=get(els[i].getAttribute('data-i18n'));
  var al=document.querySelectorAll('[data-i18n-alt]');
  for(var a=0;a<al.length;a++) al[a].setAttribute('alt',get(al[a].getAttribute('data-i18n-alt')));
  svg.setAttribute('aria-label',get('kin.aria'));
  var lb=document.querySelectorAll('.langs button');
  for(var l=0;l<lb.length;l++) lb[l].setAttribute('aria-pressed',String(lb[l].getAttribute('data-lang')===lang));

  var mh='<button type="button" data-i="0" aria-label="'+esc(get('kin.openLong'))+'"><span class="mk-n">广</span><span class="mk-t">'+esc(get('kin.open'))+'</span></button>';
  for(var k=1;k<=12;k++){
    var np=nameParts(MARKS[k-1]);
    mh+='<button type="button" data-i="'+k+'" aria-label="'+esc(get('kin.mark')(k))+'"><span class="mk-n">'+NUMK[k-1]+'</span><span class="mk-t">'+np.main+(np.sub?' '+np.sub:'')+'</span></button>';
  }
  document.getElementById('marks').innerHTML=mh;

  var sp=T[lang].specs, sh='';
  for(var s=0;s<sp.length;s++) sh+='<div><dt>'+esc(sp[s][0])+'</dt><dd>'+esc(sp[s][1])+'</dd></div>';
  document.getElementById('spec').innerHTML=sh;

  var order=['head','body','tail','gear','stand'], ph='';
  for(var o=0;o<order.length;o++){
    ph+='<div><h3>'+esc(get('gp.'+order[o]))+'</h3>';
    for(var q=0;q<PARTS.length;q++){
      if(PARTS[q][0]!==order[o]) continue;
      var d=T[lang].p[PARTS[q][1]];
      ph+='<div class="part"><div class="pk">'+PARTS[q][2]+'<span>'+PARTS[q][3]+'</span></div><div><strong>'+esc(d[0])+'</strong><p>'+esc(d[1])+'</p></div></div>';
    }
    if(order[o]==='gear') ph+='<p class="gnote">'+esc(get('gnote'))+'</p>';
    ph+='</div>';
  }
  document.getElementById('parts').innerHTML=ph;

  var sc=[[57,'1'],[59,'2'],[60,'♭3'],[64,'5'],[65,'♭6']], sch='';
  for(var c=0;c<sc.length;c++){var n2=nameParts(sc[c][0]);
    sch+='<div><b>'+(lang==='en'?LET[sc[c][0]%12]:n2.main)+'</b><span>'+sc[c][1]+'</span></div>';}
  document.getElementById('scale').innerHTML=sch;

  var tb='';
  for(var r=1;r<=12;r++) tb+='<tr><th scope="row"><span class="kn">'+NUMK[r-1]+'</span>'+r+'</th><td>'+nameHTML(MARKS[r-1])+'</td><td>'+LET[MARKS[r-1]%12]+(Math.floor(MARKS[r-1]/12)-1)+'</td></tr>';
  tb+='<tr><th scope="row"><span class="kn">广</span>'+esc(get('tune.open'))+'</th><td>'+nameHTML(OPEN)+'</td><td>'+LET[OPEN%12]+(Math.floor(OPEN/12)-1)+'</td></tr>';
  document.getElementById('tbody').innerHTML=tb;

  document.getElementById('examples').innerHTML=
    '<div class="ex"><div class="tile-md">'+glyph({main:'广'})+'</div><p>'+esc(get('not.ex1'))+'</p></div>'+
    '<div class="ex"><div class="tile-md">'+glyph({top:'三',main:'冖'})+'</div><p>'+esc(get('not.ex2'))+'</p></div>'+
    '<div class="ex"><div class="tile-md">'+glyph({main:'冖',inner:'水'})+'</div><p>'+esc(get('not.ex3'))+'</p></div>';

  var nh='';
  for(var n=0;n<12;n++) nh+='<li><span class="nk">'+NUMK[n]+'</span><span class="nd">'+(n+1)+' &middot; '+NUMR[n]+'</span></li>';
  document.getElementById('numgrid').innerHTML=nh;

  var tc=T[lang].tech;
  document.getElementById('techR').innerHTML=techs(RAD_R,tc.rn,tc.rd);
  document.getElementById('techL').innerHTML=techs(RAD_L,tc.ln,tc.ld);

  renderSel();
}

function setLang(l){
  if(LANGS.indexOf(l)<0) return;
  lang=l;
  try{localStorage.setItem('ichigenkin-lang',l);}catch(e){}
  render();
}
document.querySelector('.langs').addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('button'):null;
  if(b) setLang(b.getAttribute('data-lang'));
});

/* índice lateral: marca a seção visível */
(function indexSpy(){
  if(!('IntersectionObserver' in window)) return;
  var links={}, all=document.querySelectorAll('.idx a');
  for(var i=0;i<all.length;i++) links[all[i].getAttribute('href').slice(1)]=all[i];
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      for(var k in links) links[k].removeAttribute('aria-current');
      var l=links[e.target.getAttribute('data-sec')];
      if(l) l.setAttribute('aria-current','true');
    });
  },{rootMargin:'-45% 0px -50% 0px'});
  var secs=document.querySelectorAll('[data-sec]');
  for(var j=0;j<secs.length;j++) io.observe(secs[j]);
})();

/* idioma inicial */
(function init(){
  var saved=null;
  try{saved=localStorage.getItem('ichigenkin-lang');}catch(e){}
  if(saved&&LANGS.indexOf(saved)>=0) lang=saved;
  else{
    var nl=((navigator.language||'pt')+'').toLowerCase();
    if(nl.indexOf('ja')===0) lang='ja';
    else if(nl.indexOf('zh')===0) lang='zh';
    else if(nl.indexOf('en')===0) lang='en';
  }
  render();
  choose(0,false);
})();
})();
</script>
<script>
(function(){
  var els=document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){for(var i=0;i<els.length;i++) els[i].classList.add('in');return;}
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});
  },{rootMargin:'0px 0px -8% 0px'});
  for(var j=0;j<els.length;j++) io.observe(els[j]);
})();
</script>
